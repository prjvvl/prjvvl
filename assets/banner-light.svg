<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowLight" cx="50%" cy="0%" r="75%">
      <stop offset="0%" stop-color="#2331c7" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#2331c7" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#2331c7" stop-opacity="0" />
    </radialGradient>
    <style>
      <![CDATA[
        .bg { fill: #f6f7fb; }
        .glow {
          transform-origin: 600px 0px;
          animation: pulse 5s ease-in-out infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 0.7; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.12); }
        }
        .title {
          font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
          font-weight: 700;
          font-size: 44px;
          fill: #14183f;
        }
        .subtitle {
          font-family: 'Segoe UI', 'Trebuchet MS', sans-serif;
          font-size: 18px;
          fill: #565d8c;
        }
        .cursor {
          fill: #2331c7;
          animation: blink 1s step-end infinite;
        }
        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }
      ]]>
    </style>
  </defs>

  <rect class="bg" width="1200" height="220" />
  <circle class="glow" cx="600" cy="0" r="260" fill="url(#glowLight)" />

  <text x="600" y="110" text-anchor="middle" class="title">Prajwal Jadhav<tspan class="cursor">_</tspan></text>
  <text x="600" y="145" text-anchor="middle" class="subtitle">SDE3 @ Walmart · GenAI + agentic systems</text>
</svg>
